<div class="Title">
</div>
<div class="container">
    <div class="form">
      <form [formGroup]="data" class="row g-3 needs-validation" novalidate (ngSubmit)="postRepositories($event)" >
        
        <div class="mb-3-name">
          <label for="name" class="form-label">{{ 'forms.projectName' | transloco }}</label>
          <input 
            type="text" 
            class="form-control" 
            id="name" 
            formControlName="name"
            aria-describedby="emailHelp"
            [ngClass]="{
              'is-invalid': hasErrors('name', 'required'),
              'is-valid': data.get('name')?.valid && data.get('name')?.touched
              }"
          >
          <div class="error-container">
            @if (hasErrors('name', 'required')) {
              <span class="text-danger">{{ 'forms.projectNameRequired' | transloco }}</span>
            }
          </div>
        </div>
        <div class="mb-3">
          <label for="link" class="form-label">{{ 'forms.link' | transloco }}</label>
          <input 
            type="text" 
            class="form-control" 
            id="link" 
            formControlName="link"
            aria-describedby="emailHelp"
            [ngClass]="{
              'is-invalid': hasErrors('link', 'required'),
              'is-valid': data.get('link')?.valid && data.get('link')?.touched
              }"
          >
          <div class="error-container">
            @if (hasErrors('link', 'required')) {
              <span class="text-danger">{{ 'forms.linkRequired' | transloco }}</span>
            }
          </div>
        </div>
       
       
        <div class="mb-3">
          <label for="description" class="form-label">{{ 'forms.description' | transloco }}</label>
          <input 
            type="text" 
            class="form-control" 
            id="description" 
            formControlName="description"
            aria-describedby="emailHelp"
          >
        </div>
        <div class="mb-3">

          <label for="image" class="form-label">
              {{ 'forms.projectImage' | transloco }}
          </label>
        
          <input
              type="text"
              class="form-control"
              id="image"
              formControlName="image"
              [placeholder]="'forms.imagePlaceholder' | transloco">

        </div>
        <div class="mb-3">
          <label for="skills" class="form-label">{{ 'forms.skills' | transloco }}</label>
          <div class="skills-grid">
            @for (skill of skills; track skill.id) {
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="skill.id"
                  (change)="onSkillChange($event, skill.data.skillName)">
  
                <label class="form-check-label" [for]="skill.id">
                  {{ skill.data.skillName }}
                </label>
  
              </div>
            }
          </div>
          <div class="error-container">
            @if (hasErrors('skills', 'required')) {
            <span class="text-danger">{{ 'forms.skillsRequired' | transloco }}</span>
            }
          </div>
        </div>
          <div class="btn-container">
            <button 
              type="button"
              class="btn btn-primary-close" 
              data-bs-dismiss="modal">
              {{ 'forms.cancel' | transloco }}
            </button>
            <button type="submit" class="btn btn-primary">{{ 'forms.register' | transloco }}</button>
          </div>
      </form>
    </div>
</div>
