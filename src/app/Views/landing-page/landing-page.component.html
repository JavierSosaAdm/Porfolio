<div class="landing-page">

    <header class="landing-header">
        <div class="image-logo">
            <img
                src="assets/image/Logo.png"
                alt="Logo del sitio">
        </div>

        <h1 class="title">
            {{ 'landing.title' | transloco }}
        </h1>
    </header>

    <main>
        <section id="introduction">
            <app-introduction></app-introduction>
        </section>

        <section id="service">
            <app-carousel></app-carousel>
        </section>

        <section id="repositories">
            <div class="repositories-introduction">
                <h2>{{ 'landing.repositoriesTitle' | transloco }}</h2>

                <p>
                    {{ 'landing.repositoriesP1' | transloco }}
                </p>

                <p>
                    {{ 'landing.repositoriesP2' | transloco }}
                </p>

                <p>
                    {{ 'landing.repositoriesP3' | transloco }}
                </p>
            </div>

            <div class="repositories-showcase">
                <app-carousel-repository
                    [repositories]="repoList">
                </app-carousel-repository>
            </div>
        </section>

        <section id="contact">
            <app-contact></app-contact>
        </section>
    </main>

    <div class="chat">
        <button
            type="button"
            class="chat-button"
            [attr.aria-label]="'chat.open' | transloco"
            [attr.aria-expanded]="showChat"
            (click)="showChat = !showChat">
        
            <i class="bi bi-chat-dots-fill"></i>
            
            @if (unreadCount > 0) {
                <span class="chat-badge">
                    {{ unreadCount > 99 ? '99+' : unreadCount }}
                </span>
            }
        </button>

        <div
            id="chat"
            [class.chat-visible]="showChat"
            [class.chat-hidden]="!showChat">

            <app-chat
                [isOpen]="showChat"
                (unreadCountChange)="onUnreadCountChange($event)">
            </app-chat>
        </div>
    </div>

</div>
