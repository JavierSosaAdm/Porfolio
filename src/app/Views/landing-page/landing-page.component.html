<div class="container">
    <div id="profile">
        <!-- <app-profile/> -->
        <app-carousel/>
    </div>
    <div id="repositories">
        <h1>Bienvanidos a mis trabajos</h1>
        <h2>Repositorios:</h2>
        <app-card
        *ngFor="let repo of repoList"
        [repository]="repo.data"/>
    </div>
    <div class="chat">
        <button
            type="button"
            class="chat-button"
            (click)="showChat = !showChat"
            >
            <i class="bi bi-chat-dots-fill"></i>
        </button>
        @if (showChat) {
            <div id="chat">
                <app-chat/>
            </div>
        }
    </div>

    <div id="contact">
        <app-contact/>
    </div>
</div>
