<div class="container">
    <div class="imageLog">
        <img src="../../../assets/image/Logo.png" alt="">
    </div>
        <h2 class="title">Desarrollo de soluciones Web</h2>
    <div id="introduction">
        <app-introduction/>
    </div>
    
    <div id="service">
        <app-carousel/>  
    </div>

    <div id="repositories">
        <h1>Bienvanidos a mis trabajos</h1>
        <h2>Repositorios:</h2>
        <app-carousel-repository [repositories]="repoList"/>
    </div>

    <div class="chat">
        <button
            type="button"
            class="chat-button"
            (click)="showChat = !showChat"
            >
            <i class="bi bi-chat-dots-fill"></i>
        </button>
        @if (showChat) {
            <div id="chat">
                <app-chat/>
            </div>
        }
    </div>

    <div id="contact">
        <app-contact/>
    </div>

</div>
