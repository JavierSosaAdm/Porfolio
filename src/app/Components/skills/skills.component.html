<section id="profile">

  <h3>{{ 'skills.title' | transloco }}</h3>

    <p>
      {{ 'skills.description' | transloco }}
    </p>

  <div class="skills-container">
    @for (row of skillRows; track $index) {
      <div class="skill-lane">
        <div
          class="skill-track"
          [class.reverse]="$index === 1">
          @for (skill of row; track skill.id) {
            <a 
              [href]="skill.data.documentation"
              target="_blank"
              rel="noopener noreferrer"
              class="skill">

              <div class="skill-icon">

                <i [class]="skill.data.image"></i>
                <img [src]="skill.data.img" [alt]="skill.data.skillName">
                
              </div>
              
              <span class="skill-name">
                {{ skill.data.skillName }}
              </span>

            </a>
          }

          @for (skill of row; track skill.id + '-duplicate') {
            <a 
              [href]="skill.data.documentation"
              target="_blank"
              rel="noopener noreferrer"
              class="skill">

              <div class="skill-icon">

                <i [class]="skill.data.image"></i>
                <img [src]="skill.data.img" [alt]="skill.data.skillName">
                
              </div>
              
              <span class="skill-name">
                {{ skill.data.skillName }}
              </span>

            </a>
          }

        </div>

      </div>
    }

  </div>  
    
</section>
