<section class="repository-carousel">

    <button
        type="button"
        class="carousel-button previous-button"
        aria-label="Ver proyecto anterior"
        (click)="previous()">

        <i class="bi bi-chevron-up"></i>
    </button>

    <div class="carousel-viewport">
        @for (repo of repositories; track repo.id; let i = $index) {
            <div
                class="carousel-card"
                [class.active]="getCardClass(i) === 'active'"
                [class.previous]="getCardClass(i) === 'previous'"
                [class.next]="getCardClass(i) === 'next'"
                [class.hidden]="getCardClass(i) === 'hidden'"
                [style.transform]="getCardPosition(i)"
                (click)="selectCard(i)">

                <app-card [repository]="repo.data"></app-card>
            </div>
        }
    </div>

    <button
        type="button"
        class="carousel-button next-button"
        aria-label="Ver siguiente proyecto"
        (click)="next()">

        <i class="bi bi-chevron-down"></i>
    </button>

</section>
